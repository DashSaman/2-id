[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twoid"
version = "0.1.0"
description = "Reference Telegram/API platform for Apple account creation orders"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<0.130",
  "uvicorn[standard]>=0.34,<0.40",
  "sqlalchemy>=2.0.40,<2.1",
  "psycopg[binary]>=3.2,<3.4",
  "alembic>=1.16,<1.19",
  "cryptography>=45,<47",
  "aiogram>=3.20,<4",
  "httpx>=0.28,<0.29",
  "email-validator>=2.2,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
